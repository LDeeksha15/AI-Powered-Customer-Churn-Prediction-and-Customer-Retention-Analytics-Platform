<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){var t=localStorage.getItem("theme")||"dark";document.documentElement.setAttribute("data-theme",t);})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | Churn Intelligence</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <div class="mesh-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="container-narrow">
    <div class="glass-card fade-in-up">
      <span class="eyebrow">ACCOUNT RECOVERY</span>
      <h2 style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; margin: 10px 0 8px;">Reset Your Password</h2>
      <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 22px;">
        Choose a new password for your account.
      </p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div style="padding: 11px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 10px; background: rgba(248, 113, 113, 0.12); color: #fca5a5; border: 1px solid rgba(248, 113, 113, 0.3);">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('reset_password', token=token) }}">
        <div class="form-group">
          <label for="password">New Password</label>
          <input type="password" id="password" name="password" placeholder="Minimum 8 characters" required>
        </div>
        <div class="form-group">
          <label for="confirm_password">Confirm New Password</label>
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required>
        </div>
        <button type="submit" class="btn-primary">Reset Password</button>
      </form>

      <a href="{{ url_for('login') }}" class="back-link" style="display: block; margin-top: 20px; text-align: center;">Back to Login</a>
    </div>
  </div>
</body>
</html>
